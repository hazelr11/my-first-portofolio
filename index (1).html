<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #263b60);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .profile {
            max-width: 600px;
            width: 100%;
            padding: 40px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #7c5cff;
            display: grid;
            place-items: center;
            font-size: 40px;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .intro {
            color: #c5d1e8;
            line-height: 1.6;
        }

        .tag {
            display: inline-block;
            background: rgba(124,92,255,0.25);
            border: 1px solid #8d79ff;
            padding: 9px 15px;
            border-radius: 20px;
            margin: 5px;
        }

        h2 {
            color: #a995ff;
            margin-top: 30px;
        }

        .footer {
            color: #aebbd2;
            margin-top: 35px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="profile">

        <div class="avatar">🚀</div>

        <h1>My Creative World</h1>

        <p class="intro">
            Hello! I'm a student exploring technology,
            creativity and programming.
        </p>

        <h2>My Skills</h2>

        <div>
            <span class="tag">Python</span>
            <span class="tag">Video Editing</span>
            <span class="tag">Design</span>
        </div>

        <h2>My Mission</h2>

        <p class="intro">
            Learning new skills and building amazing things
            with technology.
        </p>

        <div class="footer">
            Created by me | My First Portfolio
        </div>

    </div>
</body>
</html>
